# vi: ft=hyprlang

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

windowrulev2 = workspace name:steam silent, class:steam

# windowrule = maximize, class:.*

# weird white box, begone
windowrule = opacity 0 override, class:xwaylandvideobridge

windowrulev2 = workspace name:dc silent, class:discord
